---
# tasks file for lingfra.shell.zsh

- name: "Include OS specific variables"
  ansible.builtin.include_vars:
    file: "{{ lookup('ansible.builtin.first_found', params) }}"
  vars:
    params:
      files:
        - "{{ ansible_distribution }}.yaml"
        - "{{ ansible_os_family }}.yaml"
        - "defaults.yaml"
      paths:
        - "vars"

- name: "Gather available users from /etc/passwd"
  ansible.builtin.getent:
    database: passwd
  when:
    - zsh_user_list | length > 0

# ---------- Installation ----------

- name: "Install ZSH packages"
  ansible.builtin.package:
    name: "{{ zsh_install_package_list }}"
    state: present
    update_cache: true
  become: true
  when:
    - zsh_install

# ---------- Configuration ----------

- name: "Set ZSH as default shell"
  ansible.builtin.user:
    name: "{{ user }}"
    shell: "{{ zsh_bin_path }}"
  become: true
  loop: "{{ zsh_user_list }}"
  loop_control:
    loop_var: user
  when:
    - user in getent_passwd.keys()

- name: "Ensure /etc/zsh exist"
  ansible.builtin.file:
    path: /etc/zsh
    state: directory
    mode: "0755"
    owner: root
    group: root
  become: true

- name: "Template ZSH config files"
  ansible.builtin.template:
    src: "{{ config_file ~ '.j2' }}"
    dest: "/etc/zsh/{{ config_file }}"
    mode: "0644"
    owner: root
    group: root
  become: true
  diff: true
  loop:
    - zshenv
    - zshrc
  loop_control:
    loop_var: config_file
