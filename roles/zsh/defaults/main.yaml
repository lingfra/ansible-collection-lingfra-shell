---
# Automatically generated by aar-doc
# Enables the configuration wizard for new users from the `zsh/newuser` module.
# When set to `false` an empty function `zsh-newuser-install` is created, which prevents the real function to run.
# It defaults to `false`, because on a server it is properly undesired to create user specific configurations.
zsh_conf_enable_newuser_wizard: false
# The size of zsh history.
zsh_conf_history_size: 2000
# The keybindings mode for ZSH.
zsh_conf_keybindings: emacs
